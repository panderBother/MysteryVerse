contractVersion: 1.0.0
schema:
  source: json-schema/mysteryverse.schema.json
  language: json-schema-2020-12
registry:
  governance: registry/schema-governance.json
  manifest: registry/schema-registry.json
  runtimeManifest: ../../ai_service/src/mysteryverse_ai/schemas/generated/schema-registry.json
  activeOutputBindings: ../../ai_service/src/mysteryverse_ai/schemas/generated/active_output_schemas.py
generators:
  typescript:
    tool: json-schema-to-typescript
    version: 16.0.0
    output: ../../apps/web/src/generated/contracts.ts
    options:
      - --unreachableDefinitions
      - --additionalProperties=false
  go:
    tool: github.com/atombender/go-jsonschema
    version: v0.22.0
    output: ../../backend/internal/contracts/contracts_gen.go
    package: contracts
  python:
    tool: datamodel-code-generator
    version: 0.99.0
    output: ../../ai_service/src/mysteryverse_ai/schemas/generated/models.py
    modelType: pydantic_v2.BaseModel
verification:
  schemaFingerprint: compatibility/schema-fingerprint.json
  schemaBaseline: compatibility/schema-baseline-v1.json
  examplesManifest: examples/manifest.json
