name: mysteryverse

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mysteryverse}
      MYSQL_USER: ${MYSQL_USER:-mysteryverse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-db-password}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.2.7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      [
        "sh",
        "-c",
        "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build:
      context: .
      dockerfile: deploy/docker/ai.Dockerfile
    restart: unless-stopped
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-development}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_HOST: 0.0.0.0
      AI_PORT: 8000
      AI_DATABASE_URL: ${AI_DATABASE_URL:-}
      AI_REDIS_URL: ${AI_REDIS_URL:-}
      AI_RUNTIME_PERSISTENCE_ENABLED: ${AI_RUNTIME_PERSISTENCE_ENABLED:-false}
      AI_RUNTIME_INSTANCE_ID: ${AI_RUNTIME_INSTANCE_ID:-ai-runtime-dev-1}
      AI_OWNER_LEASE_TTL_SECONDS: ${AI_OWNER_LEASE_TTL_SECONDS:-30}
      AI_OWNER_LEASE_RENEW_INTERVAL_SECONDS: ${AI_OWNER_LEASE_RENEW_INTERVAL_SECONDS:-10}
      AI_RUN_RUNTIME_DEADLINE_SECONDS: ${AI_RUN_RUNTIME_DEADLINE_SECONDS:-86400}
      AI_CHECKPOINT_ENCRYPTION_KEY: ${AI_CHECKPOINT_ENCRYPTION_KEY:-}
      AI_CHECKPOINT_ENCRYPTION_KEY_ID: ${AI_CHECKPOINT_ENCRYPTION_KEY_ID:-dev-checkpoint-v1}
      AI_CHECKPOINT_MAX_BLOB_BYTES: ${AI_CHECKPOINT_MAX_BLOB_BYTES:-1048576}
      AI_CHECKPOINT_COMPRESSION_LEVEL: ${AI_CHECKPOINT_COMPRESSION_LEVEL:-9}
      AI_COMPLETED_RUN_RETENTION_SECONDS: ${AI_COMPLETED_RUN_RETENTION_SECONDS:-2592000}
      AI_FAILED_RUN_RETENTION_SECONDS: ${AI_FAILED_RUN_RETENTION_SECONDS:-7776000}
      AI_CANCELLED_RUN_RETENTION_SECONDS: ${AI_CANCELLED_RUN_RETENTION_SECONDS:-2592000}
      AI_RUNTIME_AUDIT_RETENTION_SECONDS: ${AI_RUNTIME_AUDIT_RETENTION_SECONDS:-15552000}
      AI_IDEMPOTENCY_RETENTION_SECONDS: ${AI_IDEMPOTENCY_RETENTION_SECONDS:-604800}
      AI_CLEANUP_BATCH_SIZE: ${AI_CLEANUP_BATCH_SIZE:-100}
      AI_CLEANUP_INTERVAL_SECONDS: ${AI_CLEANUP_INTERVAL_SECONDS:-300}
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-mock}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-mock-v1}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY:-}
      AI_INTERNAL_SERVICE_ID: ${AI_INTERNAL_SERVICE_ID:-go-core}
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:-change-me-ai-internal-token}
      AI_INTERNAL_SIGNING_KEY_ID: ${AI_INTERNAL_SIGNING_KEY_ID:-dev-go-core-v1}
      AI_INTERNAL_REQUEST_SIGNING_KEY: ${AI_INTERNAL_REQUEST_SIGNING_KEY:-}
      AI_INTERNAL_REQUEST_SIGNING_PREVIOUS_KEY_ID: ${AI_INTERNAL_REQUEST_SIGNING_PREVIOUS_KEY_ID:-}
      AI_INTERNAL_REQUEST_SIGNING_PREVIOUS_KEY: ${AI_INTERNAL_REQUEST_SIGNING_PREVIOUS_KEY:-}
      AI_INTERNAL_REVOKED_KEY_IDS: ${AI_INTERNAL_REVOKED_KEY_IDS:-}
      AI_INTERNAL_SIGNATURE_WINDOW_SECONDS: ${AI_INTERNAL_SIGNATURE_WINDOW_SECONDS:-300}
      AI_INTERNAL_REQUIRED_AGENT_RUN_SCOPE: ${AI_INTERNAL_REQUIRED_AGENT_RUN_SCOPE:-ai:agent:run}
      AI_INTERNAL_NONCE_BACKEND: ${AI_INTERNAL_NONCE_BACKEND:-memory}
      AI_INTERNAL_NONCE_KEY_PREFIX: ${AI_INTERNAL_NONCE_KEY_PREFIX:-mv:internal:nonce}
      AI_INTERNAL_NONCE_STORE_TIMEOUT_SECONDS: ${AI_INTERNAL_NONCE_STORE_TIMEOUT_SECONDS:-1}
      AI_INTERNAL_KMS_PROVIDER: ${AI_INTERNAL_KMS_PROVIDER:-environment}
      AI_INTERNAL_KMS_URI: ${AI_INTERNAL_KMS_URI:-}
      AI_INTERNAL_MTLS_ENABLED: ${AI_INTERNAL_MTLS_ENABLED:-false}
      AI_INTERNAL_TLS_CERT_FILE: ${AI_INTERNAL_TLS_CERT_FILE:-}
      AI_INTERNAL_TLS_KEY_FILE: ${AI_INTERNAL_TLS_KEY_FILE:-}
      AI_INTERNAL_TLS_CA_FILE: ${AI_INTERNAL_TLS_CA_FILE:-}
      AI_INTERNAL_TLS_REQUIRE_CLIENT_CERT: ${AI_INTERNAL_TLS_REQUIRE_CLIENT_CERT:-true}
      AI_ALLOW_RESTRICTED_MODEL_CONTEXT: ${AI_ALLOW_RESTRICTED_MODEL_CONTEXT:-false}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
