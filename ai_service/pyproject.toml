[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mysteryverse-ai"
version = "0.1.0"
description = "MysteryVerse Python AI service foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "asyncmy==0.2.18",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
  "fastapi==0.165.0",
  "greenlet==3.5.6",
  "greenlet>=3.5.6",
  "httpx==0.28.1",
  "langgraph==1.2.24",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "redis==8.1.0",
  "sqlalchemy==2.1.9",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mysteryverse_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: requires MySQL/Redis infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/mysteryverse_ai/schemas/generated/models.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
