version: "2"
sql:
  - name: core
    engine: mysql
    schema:
      - migrations/00001_identity_content.sql
      - migrations/00002_script_runtime_dependencies.sql
      - migrations/00003_runtime_core.sql
      - migrations/00004_operations.sql
      - migrations/00006_user_room_flows.sql
      - migrations/00007_game_engine.sql
      - migrations/00008_script_content_management.sql
    queries: internal/storage/queries
    gen:
      go:
        package: sqlc
        out: internal/storage/sqlc
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        emit_prepared_queries: true
        overrides:
          - db_type: json
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
              pointer: true
